<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Schema relationship graph snippet</title>
  <desc id="desc">A sample relationship graph for SQL Copilot showing clients, projects, invoices, payments, employees, tasks, and time logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity=".48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#22d3ee"/>
    </marker>
    <style>
      .title { fill:#f8fafc; font:800 30px Inter, Segoe UI, Arial, sans-serif; }
      .sub { fill:#cbd5e1; font:500 14px Inter, Segoe UI, Arial, sans-serif; }
      .nodeTitle { fill:#f8fafc; font:800 16px Inter, Segoe UI, Arial, sans-serif; }
      .field { fill:#cbd5e1; font:600 12px Consolas, Menlo, monospace; }
      .edge { stroke:#22d3ee; stroke-width:2.5; fill:none; marker-end:url(#arrow); opacity:.7; }
      .edge2 { stroke:#a78bfa; stroke-width:2.5; fill:none; marker-end:url(#arrow); opacity:.68; }
      .edgeLabel { fill:#94a3b8; font:600 11px Inter, Segoe UI, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Relationship Graph Snippet</text>
  <text x="58" y="86" class="sub">The planner converts business language into table links, role-aware joins, grouped measures, and validation evidence.</text>

  <path class="edge" d="M236 190 C290 190 302 190 356 190"/>
  <path class="edge" d="M536 190 C588 190 604 190 656 190"/>
  <path class="edge" d="M836 190 C894 190 898 190 956 190"/>
  <path class="edge2" d="M236 356 C292 356 300 356 356 356"/>
  <path class="edge2" d="M536 356 C594 356 598 356 656 356"/>
  <path class="edge2" d="M506 278 C546 258 612 244 676 222"/>

  <text x="268" y="174" class="edgeLabel">client_id</text>
  <text x="568" y="174" class="edgeLabel">project_id</text>
  <text x="874" y="174" class="edgeLabel">invoice_id</text>
  <text x="270" y="340" class="edgeLabel">assigned_to</text>
  <text x="568" y="340" class="edgeLabel">task_id</text>
  <text x="548" y="250" class="edgeLabel">project_id</text>

  <g filter="url(#shadow)">
    <g transform="translate(56 132)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(103,232,249,.26)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#cyan)"/>
      <path d="M30 11h22M41 0v22" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
      <text x="22" y="52" class="nodeTitle">clients</text>
      <text x="22" y="80" class="field">client_id PK</text>
      <text x="22" y="102" class="field">tier</text>
    </g>
    <g transform="translate(356 132)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(103,232,249,.26)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#emerald)"/>
      <path d="M28 7h26M28 20h18" stroke="#052e16" stroke-width="5" stroke-linecap="round"/>
      <text x="22" y="52" class="nodeTitle">projects</text>
      <text x="22" y="80" class="field">project_id PK</text>
      <text x="22" y="102" class="field">client_id FK</text>
    </g>
    <g transform="translate(656 132)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(103,232,249,.26)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#amber)"/>
      <text x="27" y="18" fill="#422006" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="900">$</text>
      <text x="22" y="52" class="nodeTitle">invoices</text>
      <text x="22" y="80" class="field">invoice_id PK</text>
      <text x="22" y="102" class="field">amount, status</text>
    </g>
    <g transform="translate(956 132)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(103,232,249,.26)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#emerald)"/>
      <path d="M31 16l9 9 18-22" stroke="#052e16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="52" class="nodeTitle">payments</text>
      <text x="22" y="80" class="field">payment_id PK</text>
      <text x="22" y="102" class="field">invoice_id FK</text>
    </g>
    <g transform="translate(56 298)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(167,139,250,.28)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#cyan)"/>
      <circle cx="41" cy="7" r="9" fill="#0f172a"/>
      <path d="M26 28c4-17 26-17 30 0" stroke="#0f172a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="22" y="52" class="nodeTitle">employees</text>
      <text x="22" y="80" class="field">employee_id PK</text>
      <text x="22" y="102" class="field">department</text>
    </g>
    <g transform="translate(356 298)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(167,139,250,.28)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#amber)"/>
      <path d="M29 8h24M29 21h16" stroke="#422006" stroke-width="5" stroke-linecap="round"/>
      <text x="22" y="52" class="nodeTitle">tasks</text>
      <text x="22" y="80" class="field">task_id PK</text>
      <text x="22" y="102" class="field">assigned_to FK</text>
    </g>
    <g transform="translate(656 298)">
      <rect width="180" height="116" rx="14" fill="url(#node)" stroke="rgba(167,139,250,.28)"/>
      <rect x="16" y="-14" width="50" height="50" rx="10" fill="url(#emerald)"/>
      <path d="M28 26h28M34 14v24M50 8v30" stroke="#052e16" stroke-width="5" stroke-linecap="round"/>
      <text x="22" y="52" class="nodeTitle">time_logs</text>
      <text x="22" y="80" class="field">log_id PK</text>
      <text x="22" y="102" class="field">hours, log_date</text>
    </g>
  </g>

  <g transform="translate(900 324)">
    <rect width="248" height="116" rx="14" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.14)"/>
    <text x="18" y="34" class="nodeTitle">Planner Output</text>
    <text x="18" y="62" class="field">grain: month</text>
    <text x="18" y="84" class="field">measure: SUM(amount)</text>
    <text x="18" y="106" class="field">join: clients to invoices</text>
  </g>
</svg>
