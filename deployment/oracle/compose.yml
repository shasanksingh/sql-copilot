services:
  flask_api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      SQL_COPILOT_PROJECT_ROOT: /app
      SQL_COPILOT_RUNTIME_DIR: /app/.runtime
      SQL_COPILOT_CACHE_DIR: /app/.runtime/cache
      SQL_COPILOT_SQLITE_DIR: /app/.runtime/sqlite
      SQL_COPILOT_LOG_DIR: /app/.runtime/logs
      SQL_COPILOT_TEMP_DIR: /app/.runtime/tmp
      SQL_COPILOT_FAISS_DIR: /app/.runtime/cache/faiss
      SQL_COPILOT_MODEL_DIR: /app/.runtime/models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime:/app/.runtime

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=14d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - flask_api

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-before-production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
